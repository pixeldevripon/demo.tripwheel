name: CI

# Lint + build + unit tests for the backend, on pushes and PRs against main
# that touch backend code.
#
# MONOREPO NOTE: this file must live at the REPOSITORY ROOT (.github/workflows/).
# It previously sat at backend-frontend/.github/workflows/, where GitHub never
# looks - so nothing ran at all. Every path below is repo-relative as a result,
# not backend-relative.
#
# The frontend and the dashboard deploy through Vercel's Git integration, which
# runs its own `next build` as a required check on every push. They are
# intentionally not built here too - that would double CI time for no new
# signal.
on:
  push:
    branches: [main]
    paths:
      - 'backend-frontend/backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-frontend/backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-frontend/backend
    env:
      # Prisma needs DATABASE_URL to generate the client even without a real DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/island_tours
      # crypto.util.ts is imported by the specs and validates this at load.
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Repo-relative, unlike `working-directory` above: the cache action
          # resolves this from the workspace root, not the job's working dir.
          cache-dependency-path: backend-frontend/backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client (no DB needed) so tsc/nest can type-check.
      - run: pnpm prisma:generate

      - run: pnpm lint

      - run: pnpm build

      # Unit specs are mocked - no Postgres/Redis required.
      - run: pnpm test
