# ──────────────────────────────────────────────────────────────────────────────
# Island Tours - PRODUCTION stack (Hostinger VPS)
#
#   postgres  - app database (internal only, persisted to a named volume)
#   redis     - BullMQ broker (internal only, password-protected, persisted)
#   backend   - NestJS API, bound to 127.0.0.1 so nginx terminates TLS in front
#
# The frontend is NOT here - it is deployed separately on Vercel and talks to
# this backend over https://api.<your-domain> (nginx -> 127.0.0.1:5050).
#
# Compose reads ./.env automatically for the ${VARS} below. Backend app secrets
# come from ./backend/.env.production (see env_file). Copy the *.example files
# and fill them in before the first `docker compose up`.
#
#   docker compose up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No `ports:` - reachable only from the internal compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - island-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence + password. No public port -> only the backend reaches it.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - island-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: island-tours-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    # App secrets (Better Auth, Cloudinary, Resend, Stripe-not-here, etc.).
    env_file:
      - ./backend/.env.production
    # Infra-coupled vars OVERRIDE anything in env_file - they always point at the
    # compose services, never at Upstash or localhost.
    environment:
      NODE_ENV: production
      PORT: '5050'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Seed only on the boot where you explicitly ask for it (first deploy).
      RUN_SEED: ${RUN_SEED:-false}
      # TEMPORARY, 2026-07-21 - diagnosing pg's "client.query() when the client
      # is already executing a query" DeprecationWarning, which appears only in
      # this container (the BullMQ workers do not run locally without Redis).
      #
      # Node prints each DeprecationWarning ONCE and WITHOUT a stack, so the bare
      # line names no caller and cannot be traced after the fact. With this flag
      # the same warning arrives with a full stack pointing at the code
      # responsible. Application Prisma code is already ruled out: `Promise.all`
      # on the pool, `$transaction([...])` batches, and even `Promise.all` inside
      # an interactive transaction were all verified clean - Prisma serializes
      # operations on a transaction connection - so the caller is a dependency.
      #
      # REMOVE once the culprit is identified: --trace-deprecation makes every
      # deprecation in every dependency print a stack, which is noise in normal
      # operation. To switch it off without editing this file, put an EMPTY
      # `NODE_OPTIONS=` in ./.env - the default below uses `-` rather than `:-`
      # precisely so an empty value counts as "set" and wins.
      NODE_OPTIONS: ${NODE_OPTIONS---trace-deprecation}
    # Port exposed to Coolify's Traefik proxy (or nginx if self-managed).
    # Coolify's reverse proxy runs inside Docker so loopback binding is removed.
    ports:
      - '${BACKEND_PORT:-5050}:5050'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - island-net

volumes:
  postgres-data:
  redis-data:

networks:
  island-net:
    driver: bridge
