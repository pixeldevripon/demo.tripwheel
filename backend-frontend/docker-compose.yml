# ──────────────────────────────────────────────────────────────────────────────
# Island Tours DEMO - backend stack (Hostinger VPS)
#
#   postgres  - app database (internal only, persisted to a named volume)
#   redis     - BullMQ broker (internal only, password-protected, persisted)
#   backend   - NestJS API, bound to 127.0.0.1 so the reverse proxy terminates
#               TLS in front of it (Caddy or nginx - either works, pick one)
#
# This is the ONLY thing that runs on the VPS. The public site and the dashboard
# build on Vercel and reach this stack over https://api.demo.<your-domain>, which
# the proxy forwards to 127.0.0.1:5150. There is no third app - the admin login
# gate lives inside the dashboard.
#
# Compose reads ./.env automatically for the ${VARS} below, including
# COMPOSE_PROJECT_NAME - which is what keeps this stack's volumes separate from
# production's when both run on one box. Backend app secrets come from
# ./backend/.env.production (see env_file). Copy the *.example files and fill
# them in before the first `docker compose up`.
#
# Full runbook: docs/operations/DEMO-DEPLOYMENT.md
#
#   docker compose up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # LOOPBACK ONLY, for an SSH tunnel from a laptop (TablePlus, DBeaver, Prisma
    # Studio). The backend does not use this: it reaches postgres:5432 over the
    # internal compose network, so removing the mapping breaks a GUI and nothing
    # else.
    #
    # Keep the `127.0.0.1:` prefix. A bare '5433:5432' binds 0.0.0.0, and Docker
    # writes its own iptables rules, so UFW will NOT protect you - the database
    # would be reachable from the internet with the credentials in ./.env.
    #
    # Host side is 5433 because production holds 5432 on this box; a collision
    # fails the whole `up` with "port is already allocated".
    #
    # Committed rather than hand-edited on the VPS on purpose: the deploy
    # workflow runs `git reset --hard <sha>` in the repo root, which silently
    # reverts a local edit here, and the tunnel then fails with nothing in any
    # log to explain it.
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - island-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence + password. No public port -> only the backend reaches it.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - island-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # DEMO-SCOPED NAME. Production runs on the same VPS as
    # island-tours-backend:*, and the deploy workflow prunes old image tags
    # by reference filter - a shared name would let a demo deploy delete
    # production's rollback images. Change this and you must change the
    # filter in .github/workflows/deploy-backend.yml to match.
    image: demo-tripwheel-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    # App secrets (Better Auth, Cloudinary, Resend, Stripe-not-here, etc.).
    env_file:
      - ./backend/.env.production
    # Infra-coupled vars OVERRIDE anything in env_file - they always point at the
    # compose services, never at Upstash or localhost.
    environment:
      NODE_ENV: production
      PORT: '5050'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Seed only on the boot where you explicitly ask for it (first deploy).
      RUN_SEED: ${RUN_SEED:-false}
      # Off by default. Upstream ran --trace-deprecation here from 2026-07-21 to
      # chase a pg "client.query() while the client is already executing a query"
      # DeprecationWarning: Node prints each one ONCE and WITHOUT a stack, so the
      # bare line names no caller. Application Prisma code was ruled out
      # (`Promise.all` on the pool, `$transaction([...])` batches, and
      # `Promise.all` inside an interactive transaction all verified clean, since
      # Prisma serializes operations on a transaction connection) - so the caller
      # is a dependency.
      #
      # On the demo that flag is only log noise: it makes every deprecation in
      # every dependency print a stack. To turn it back on for an investigation,
      # set `NODE_OPTIONS=--trace-deprecation` in ./.env.
      #
      # `-` rather than `:-` on purpose, so an explicitly EMPTY value in ./.env
      # still counts as "set" and wins over this default.
      NODE_OPTIONS: ${NODE_OPTIONS-}
    # Bound to LOOPBACK. The proxy (Caddy or nginx) is the only public entrance,
    # and it reaches the API over 127.0.0.1 on the host.
    #
    # Keep the `127.0.0.1:` prefix on whatever you set in ./.env. A bare port
    # binds 0.0.0.0, and Docker writes its own iptables rules, so UFW will NOT
    # protect you - the API would be reachable from the internet with no TLS.
    #
    # The default is the DEMO port, so a missing or unset BACKEND_PORT fails
    # closed on the demo's own port rather than open on production's 5050.
    ports:
      - '${BACKEND_PORT:-127.0.0.1:5150}:5050'
    healthcheck:
      # Postgres and Redis are health-checked above; without this the API is not,
      # so a container that boots and then wedges stays `Up` forever and is never
      # restarted. `node -e` rather than curl: the runtime image is node:24-slim
      # and has no curl, but it does have a global fetch.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5050/api/v1/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations (and optionally the seed) run in docker-entrypoint.sh before
      # the server listens. Without a start period a slow migration looks like a
      # failing container.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - island-net

  # OPT-IN ONLY. `profiles:` means a plain `docker compose up -d` - which is what
  # deploy-backend.yml runs - skips this service entirely. It never starts on a
  # deploy, never costs the box its ~200MB, and is never left running unattended.
  #
  #   docker compose --profile tools up -d pgadmin
  #   docker compose --profile tools stop pgadmin
  #
  # It sits on island-net, so it reaches postgres:5432 container to container.
  # That is the whole point: no SSH tunnel between pgAdmin and the database, so
  # none of the identity-file and port-translation problems of a laptop client.
  # You tunnel pgAdmin's HTTP port instead:
  #
  #   ssh -N -L 8082:127.0.0.1:8082 vps      # then http://127.0.0.1:8082
  #
  # Full walkthrough: docs/operations/DATABASE-GUI-ACCESS.md §5b
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@demo.tripwheel.io}
      # Empty default on purpose: no compose warning on every ordinary `up`, and
      # the container fails loudly on the one command that actually needs it.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_LISTEN_PORT: '80'
      # Skip the second prompt. Saved server passwords are then encrypted with
      # the login password instead of a separate master one.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # Pre-registers the demo database, so there is no host or port to type.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      # Without this you re-register the server on every restart.
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    # LOOPBACK ONLY, exactly as for postgres. A bare '8082:80' puts a pgAdmin
    # login on the public internet, and Docker's iptables rules bypass UFW.
    ports:
      - '127.0.0.1:8082:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - island-net

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:

networks:
  island-net:
    driver: bridge
