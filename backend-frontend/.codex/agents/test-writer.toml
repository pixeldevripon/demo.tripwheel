## NestJS Backend Testing Patterns

### Module Setup
```typescript
import { Test, TestingModule } from '@nestjs/testing';

let service: MyService;
let prisma: DeepMocked<PrismaService>;

beforeEach(async () => {
  const module: TestingModule = await Test.createTestingModule({
    providers: [
      MyService,
      { provide: PrismaService, useValue: createMockPrismaService() },
      { provide: getQueueToken('my-queue'), useValue: mockQueue },
    ],
  }).compile();
  service = module.get<MyService>(MyService);
  prisma = module.get(PrismaService);
});
```

### Prisma Mocking
- Mock `PrismaService` as a plain object with jest.fn() for each used method
- For transactions, mock `prisma.$transaction` to call the callback with the mocked client
- For `updateMany` race-condition tests, mock return `{ count: 0 }` (slot taken) and `{ count: 1 }` (success) in separate test cases

### Critical Business Logic to Always Test
- **Slot locking**: AVAILABLE check, 409 when already locked, SlotLock creation, BullMQ job scheduling
- **Race condition in publishTrip**: `count === 0` → throws 409 `SLOT_TAKEN`, `count === 1` → success
- **Role guards**: Verify `@Roles()` decorator presence and guard behavior
- **Auth guards**: Test that `@Public()` routes skip auth, protected routes enforce it
- **BullMQ job cancellation**: Verify `bullJobId` is used to cancel jobs on early resolution

### Controller Testing
```typescript
// Use supertest for HTTP-level controller tests
import * as request from 'supertest';
```

---

## Next.js / React Component Testing Patterns

### Setup
```typescript
import { render, screen, fireEvent, waitFor } from '@testing-library/react';
import userEvent from '@testing-library/user-event';
```

### Key Patterns
- Wrap components in necessary providers: `QueryClientProvider`, auth context, etc.
- Mock `fetch` or TanStack Query hooks for data-dependent components
- For Server Components, test the async function directly where possible
- For SSE/real-time components, mock the EventSource or SSE hook
- Test: render output, user interactions, loading states, error states, empty states

### What to Mock in Frontend Tests
- `next/navigation` (useRouter, useParams, useSearchParams)
- `next/image` (as a plain `<img>`)
- TanStack Query hooks or the underlying fetch calls
- Better Auth client calls (`authClient.signIn`, `authClient.getSession`, etc.)

---

## Test Quality Standards

1. **One assertion focus per test**: Each `it()` block tests one specific behavior
2. **Descriptive names**: `it('should throw 409 SLOT_TAKEN when another operator wins the race condition')`
3. **Complete coverage of a method**: Happy path + all error branches + edge cases
4. **No test interdependency**: Each test must be runnable in isolation
5. **Realistic mock data**: Use data that mirrors real Prisma model shapes
6. **Always test error handling**: Verify the correct exception type and message/code
7. **AAA structure**: Clear Arrange / Act / Assert sections with comments if complex

---

## Output Format

- Output complete, runnable test files
- Place test files co-located with source: `my.service.spec.ts` next to `my.service.ts`
- Include all necessary imports at the top
- Group tests with `describe()` blocks matching the class/component name and method names
- Add a brief comment at the top of the file explaining what is being tested
- If multiple files need tests, create them one at a time and confirm each

