name: Deploy backend (VPS)

# Deploys the backend to the Hostinger VPS on every push to prod that touches
# backend code or the compose stack. prod is the release branch - main stays
# the integration branch and never deploys. The frontend deploys itself via
# Vercel's Git integration (production branch: prod), so it is intentionally
# not handled here.
on:
  push:
    branches: [prod]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # allow manual "Run workflow"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # The action defaults to 10m, which killed run #60 mid-rebuild: a
          # cold cache means every layer is rebuilt, and that alone outruns ten
          # minutes on this box. Generous rather than tight - the concurrency
          # group already serialises deploys, so a slow one blocks nothing but
          # itself.
          command_timeout: 30m
          # Pull the pushed commit, rebuild only the backend image, recreate the
          # container. migrate deploy runs automatically in docker-entrypoint.sh.
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all --prune
            git reset --hard ${{ github.sha }}
            export BACKEND_IMAGE_TAG=${{ github.sha }}

            # Reclaim BEFORE building, not after. Every deploy tags a new
            # island-tours-backend:<sha>, so those images are never DANGLING and
            # the `docker image prune -f` below could never touch them - they
            # accumulated deploy after deploy until the VPS ran out of disk
            # mid-`COPY node_modules` (run #59, 2026-08-08). Keep the 3 newest:
            # the running one, plus room to roll back by hand.
            #
            # ─────────────────────────────────────────────────────────────
            # HARD RULE: this step reclaims IMAGES and BUILD CACHE only.
            # Never `docker system prune --volumes`, never `docker volume rm`,
            # never `docker compose down -v`. postgres-data on this host IS the
            # production database - there is no other copy on the box. Every
            # command below is scoped to images or buildkit cache, and it stays
            # that way.
            # ─────────────────────────────────────────────────────────────
            docker images --filter=reference='island-tours-backend:*' \
              --format '{{.CreatedAt}}\t{{.ID}}' \
              | sort -r | tail -n +4 | cut -f2 \
              | xargs -r docker rmi -f || true
            # Layer cache from builds that are weeks dead. `-a` because the
            # cache for an image we just deleted is not "dangling" either.
            # `tail -1` keeps the reclaimed-space total and drops the
            # record-by-record list, which ran to a thousand lines of log.
            docker builder prune -af --filter 'until=168h' 2>&1 | tail -1 || true
            df -h / | tail -1

            docker compose build backend
            docker compose up -d
            docker image prune -f
            docker compose ps
