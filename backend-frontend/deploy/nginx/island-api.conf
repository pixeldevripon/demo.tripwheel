# Island Tours - backend API reverse proxy (host nginx, NOT in Docker).
#
# Install on the VPS:
#   sudo cp deploy/nginx/island-api.conf /etc/nginx/sites-available/island-api
#   sudo ln -s /etc/nginx/sites-available/island-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then provision TLS - certbot rewrites this file to add the :443 server block,
# the certificate paths, and an http->https redirect automatically:
#   sudo certbot --nginx -d api.your-domain.com
#
# Replace api.your-domain.com below with your real API subdomain first.

server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # Allow room for media uploads (Cloudinary passthrough, multipart forms).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;

        # Forward real client info so ThrottlerGuard + Better Auth behave
        # (the app trusts exactly one proxy hop - see backend/src/main.ts).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not buffer the request body - Stripe webhook signature verification
        # needs the raw bytes intact (backend bootstraps with rawBody: true).
        proxy_request_buffering off;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
