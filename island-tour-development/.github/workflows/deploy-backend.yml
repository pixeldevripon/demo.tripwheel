name: Deploy backend (Coolify)

# Triggers a Coolify redeploy on every push to main that touches backend code
# or the compose stack — but ONLY after CI passes (needs_ci gate below).
# Coolify pulls the latest commit, rebuilds the backend image via docker-compose,
# and runs migrations automatically via docker-entrypoint.sh.
#
# The frontend deploys automatically via Vercel's Git integration.
#
# Required GitHub secret:
#   COOLIFY_WEBHOOK_URL  — the deploy webhook URL from Coolify
#                          (Service → Settings → Deploy Webhook)
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # allow manual "Run workflow"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Gate: wait for CI (lint + build + tests) to pass before deploying.
  needs_ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (lint · build · test)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: needs_ci
    steps:
      - name: Trigger Coolify webhook
        run: |
          curl -fsSL \
            -X GET \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}"
        # Coolify's deploy webhook is a simple GET request.
        # If your Coolify version requires POST + token, change to:
        #   -X POST \
        #   -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
