name: Deploy backend (VPS)

# Deploys the backend to the Hostinger VPS on every push to prod that touches
# backend code or the compose stack. prod is the release branch - main stays
# the integration branch and never deploys. The frontend deploys itself via
# Vercel's Git integration (production branch: prod), so it is intentionally
# not handled here.
on:
  push:
    branches: [prod]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # allow manual "Run workflow"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Pull the pushed commit, rebuild only the backend image, recreate the
          # container. migrate deploy runs automatically in docker-entrypoint.sh.
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all --prune
            git reset --hard ${{ github.sha }}
            export BACKEND_IMAGE_TAG=${{ github.sha }}
            docker compose build backend
            docker compose up -d
            docker image prune -f
            docker compose ps
