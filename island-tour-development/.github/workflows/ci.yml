name: CI

# Lint + build + unit tests for the backend on PRs and pushes (main =
# integration, prod = release) that touch backend code. The frontend deploys
# via Vercel's Git integration (with its own build checks), so it is
# intentionally not covered here.
on:
  push:
    branches: [main, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma needs DATABASE_URL to generate the client even without a real DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/island_tours
      # Needed for crypto.util.ts which is imported in tests
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client (no DB needed) so tsc/nest can type-check.
      - run: pnpm prisma:generate

      - run: pnpm lint

      - run: pnpm build

      # Unit specs are mocked - no Postgres/Redis required.
      - run: pnpm test
