name: CI

# Lint + build + unit tests for both apps on every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma needs DATABASE_URL to generate the client even without a real DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/island_tours
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client (no DB needed) so tsc/nest can type-check.
      - run: pnpm prisma:generate

      - run: pnpm lint

      - run: pnpm build

      # Unit specs are mocked - no Postgres/Redis required.
      - run: pnpm test

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time placeholder; the real value is set in Vercel project settings.
      NEXT_PUBLIC_BACKEND_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build
