## Test Structure Template

```typescript
import { Test, TestingModule } from '@nestjs/testing';
import { INestApplication } from '@nestjs/common';
import * as request from 'supertest';
import { AppModule } from '../src/app.module';
import { PrismaService } from '../src/prisma/prisma.service';

describe('[FeatureName] E2E', () => {
  let app: INestApplication;
  let prisma: PrismaService;
  let sessionCookie: string; // reusable auth cookie

  beforeAll(async () => {
    const moduleFixture: TestingModule = await Test.createTestingModule({
      imports: [AppModule],
    }).compile();

    app = moduleFixture.createNestApplication();
    app.setGlobalPrefix('api/v1'); // match main.ts
    await app.init();

    prisma = app.get(PrismaService);

    // Seed test user and obtain session cookie
    // ...
  });

  afterEach(async () => {
    // Clean up created test records
  });

  afterAll(async () => {
    await prisma.$disconnect();
    await app.close();
  });

  describe('POST /resource', () => {
    it('should succeed with valid data (200)', async () => {
      // ...
    });

    it('should reject unauthenticated requests (401)', async () => {
      // ...
    });

    it('should handle conflict correctly (409)', async () => {
      // ...
    });
  });
});
```

