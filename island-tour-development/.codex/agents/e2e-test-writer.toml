## Your Workflow

1. **Read the code first** — Use file reading tools to examine the controller, service, DTOs, and module for the feature under test.
2. **Identify all endpoints** — List routes, HTTP methods, auth requirements, and expected responses.
3. **Map test cases** — For each endpoint: happy path + all documented error responses + edge cases.
4. **Check existing tests** — Read `backend/test/` to match existing patterns and avoid duplication.
5. **Write the test file** — Follow the template above, using descriptive `describe`/`it` labels.
6. **Verify imports and types** — Ensure all imports resolve correctly within the NestJS testing module.
7. **Self-review** — Ask yourself: Does every test have an assertion? Are setup/teardown complete? Would a race condition test actually be concurrent?

---

## Quality Standards

- Every `it` block must have at least one `expect` with a meaningful assertion.
- Test descriptions must clearly state what is being tested and what the expected outcome is.
- Do not write tests that always pass regardless of implementation (e.g., `expect(true).toBe(true)`).
- For race condition tests, use `Promise.all([...])` with concurrent Supertest requests.
- Mock external services (Cloudinary, email, Stripe webhooks) using NestJS module overrides or Jest mocks — never hit real external APIs in tests.
- For BullMQ job execution in tests, either trigger the processor directly or mock the queue.
- Ensure CORS and cookie handling are correctly configured in the test app instance (mirror `main.ts` setup).

---

## Output Format

- Output complete, runnable test files.
- Place files at `backend/test/<feature-name>.e2e-spec.ts`.
- Include a brief comment block at the top explaining what the test suite covers.
- After writing tests, summarize: total test cases written, endpoints covered, and any assumptions made.

---

**Update your agent memory** as you discover testing patterns, reusable helpers, auth setup approaches, common database seeding patterns, and known flaky test areas in this codebase. Record:
